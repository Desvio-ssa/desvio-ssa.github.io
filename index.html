<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F0E8">
<meta name="description" content="Salvador sem cartão-postal. O rolê que o guia comum não conta.">
<meta property="og:title" content="desvio.ssa">
<meta property="og:description" content="Salvador sem cartão-postal. Baile do Chamego, sábado 07/11, 19h.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://desvio-ssa.github.io/icone.png">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: app de celular no estilo dos mockups. Fundo de grade azul, cartões com borda índigo e sombra dura, barra de abas escura com microfone amarelo no centro. Tela do Guia escura. */
:root{
  --paper:#F3F0E8; --card:#FBF9F3; --indigo:#1C2A72; --cobalt:#2F52D9; --sky:#9DB2F2; --yellow:#F2B705; --stone:#25262B; --mute:#5a6190;
  --display:'Alfa Slab One','Rockwell','Georgia',serif;
  --body:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--paper)}
body{margin:0;background-color:var(--paper);color:var(--indigo);font-family:var(--body);font-weight:500;font-size:20px;line-height:1.25;
  background-image:linear-gradient(rgba(47,82,217,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(47,82,217,.13) 2px,transparent 2px);background-size:64px 64px;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px 130px;min-height:100%}
body.dark{background-color:var(--stone);color:#F3F0E8;background-image:linear-gradient(rgba(255,255,255,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.06) 2px,transparent 2px)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;line-height:1.02}
h1{font-size:38px} h2{font-size:30px}
.eyebrow{font-weight:700;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--cobalt)}
.dark .eyebrow{color:var(--sky)}
.top{display:flex;align-items:center;gap:12px}
.live{align-self:flex-start;margin-top:-4px}
.top img{width:54px;height:54px;border-radius:50%;flex:none}
.top .t{flex:1;min-width:0}
.top .t p.sub{font-size:19px;color:var(--mute)}
.card{background:var(--card);border:3px solid var(--indigo);border-radius:28px;box-shadow:5px 5px 0 var(--indigo);padding:16px;min-width:0}
button{font:inherit;color:inherit}
button.card{width:100%;text-align:left;cursor:pointer}
.map{padding:0;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map .foot{display:flex;justify-content:space-between;padding:12px 18px;font-weight:700;font-size:23px}
.map .foot b{color:var(--cobalt)}
.stop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stop .badge{margin-left:auto}
.tile{width:64px;height:64px;flex:none;border-radius:14px;border:3px solid var(--indigo);background-color:var(--cobalt);
  background-image:linear-gradient(rgba(243,240,232,.45) 2px,transparent 2px),linear-gradient(90deg,rgba(243,240,232,.45) 2px,transparent 2px);background-size:21px 21px;transform:rotate(-3deg)}
.stop .tx{flex:1 1 180px;min-width:0}
.stop h3{font-size:25px;font-weight:700;line-height:1.05}
.stop .m{color:var(--mute);font-size:19px}
.badge{background:var(--yellow);color:var(--stone);border-radius:16px;padding:8px 12px;font-weight:700;font-size:22px;white-space:nowrap}
.mission{background:var(--yellow);color:var(--stone);display:flex;align-items:center;gap:14px;border-color:var(--indigo)}
.mission .ic{width:52px;height:52px;border-radius:50%;background:var(--stone);display:grid;place-items:center;flex:none;color:var(--yellow)}
.bar{height:11px;border-radius:9px;background:rgba(37,38,43,.22);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--stone);border-radius:9px}
.mission b{font-size:23px;line-height:1.1;display:block}
.mission .num{font-family:var(--body);font-weight:700;font-size:26px}
.roundbtn{width:52px;height:52px;border-radius:50%;border:3px solid var(--indigo);background:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--indigo);padding:0}
.hero{position:relative;height:210px;border-radius:28px;border:3px solid var(--indigo);box-shadow:5px 5px 0 var(--indigo);overflow:hidden;background-color:var(--cobalt);background-image:linear-gradient(rgba(243,240,232,.22) 2px,transparent 2px),linear-gradient(90deg,rgba(243,240,232,.22) 2px,transparent 2px);background-size:48px 48px}
.hero .roundbtn{position:absolute;left:12px;top:12px}
.hero small{position:absolute;left:14px;bottom:10px;color:#F3F0E8;font-weight:700;letter-spacing:.14em;font-size:13px;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.tag{display:inline-block;align-self:flex-start;background:var(--yellow);color:var(--stone);border-radius:14px;padding:5px 14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:18px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tri .card{padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:22px}
.tri .ci{width:42px;height:42px;border-radius:50%;background:var(--sky);display:grid;place-items:center}
.tri small{font-weight:700;letter-spacing:.14em;color:var(--cobalt);font-size:14px}
.tri b{font-size:20px;line-height:1.05}
.dica{background:var(--indigo);color:#F3F0E8;border-radius:22px;padding:16px;border:3px solid var(--indigo)}
.dica .eyebrow{color:var(--yellow);display:block;margin-bottom:4px}
.dica small{display:block;margin-top:6px;color:var(--sky);font-size:16px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btns .cta{flex:1 1 150px}
.cta{flex:0 0 auto;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:21px;text-align:center;text-decoration:none;border:3px solid var(--indigo);border-radius:999px;padding:14px 12px;cursor:pointer;display:block}
.cta.p{background:var(--cobalt);color:#F3F0E8;box-shadow:5px 5px 0 var(--indigo)}
.cta.s{background:var(--card);color:var(--indigo)}
.cta:active{transform:translate(2px,2px)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:3px solid var(--indigo);background:var(--card);border-radius:999px;padding:10px 4px;font-weight:700;font-size:20px;cursor:pointer;text-align:center}
.opt[aria-pressed="true"]{background:var(--cobalt);color:#F3F0E8}
input[type=text],textarea{font:inherit;width:100%;border:3px solid var(--indigo);border-radius:20px;background:var(--card);color:var(--indigo);padding:10px 14px}
textarea{resize:vertical;min-height:64px}
.sel{background:var(--cobalt);color:#F3F0E8;border-radius:24px;box-shadow:5px 5px 0 var(--indigo)}
.sel .n{font-family:var(--display);font-size:34px;line-height:1}
.sel .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sel .lvl{color:var(--yellow);font-weight:700;letter-spacing:.2em;font-size:20px}
.sel .bar{background:rgba(255,255,255,.3);height:14px;margin-top:12px}.sel .bar i{background:var(--yellow)}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;text-align:center}
.stamp{aspect-ratio:1;display:grid;place-items:center;border-radius:22px;font-family:var(--display);font-size:38px;border:3px dashed #8b94c4;color:#8b94c4}
.stamp.on{border:3px solid var(--indigo);background:var(--sky);color:var(--indigo);box-shadow:4px 4px 0 var(--indigo);transform:rotate(-4deg);outline:3px solid var(--paper);outline-offset:-9px}
.stamp.on.y{background:var(--yellow)}
.slbl{font-weight:700;font-size:20px;margin-top:4px}
.ms{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;width:100%}
.ms .no{width:40px;height:40px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-family:var(--display);flex:none}
.ms.y .no{background:var(--yellow)}
.ms .tx{flex:1;min-width:0;font-weight:700;font-size:23px;line-height:1.05}
.ms .bar{background:#d3d5e0;margin-top:8px}.ms .bar i{background:var(--cobalt)}
.ms.done{background:#E9EEFC}
.lam{display:flex;gap:8px;margin-top:10px}
.lam button{flex:1;border:3px solid var(--indigo);background:var(--card);border-radius:16px;padding:8px 0;font-weight:700;font-size:19px;cursor:pointer}
.lam button[aria-pressed="true"]{background:var(--yellow)}
.chat{display:flex;flex-direction:column;gap:12px}
.b{max-width:88%;padding:12px 16px;border-radius:24px;font-size:22px;white-space:pre-wrap;overflow-wrap:anywhere}
.b.u{align-self:flex-end;background:var(--cobalt);color:#F3F0E8;border-bottom-right-radius:6px}
.b.g{align-self:flex-start;background:var(--paper);color:var(--indigo);border-bottom-left-radius:6px}
.live{background:rgba(242,183,5,.18);color:var(--yellow);font-weight:700;letter-spacing:.16em;border-radius:16px;padding:8px 14px;font-size:17px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:2.5px solid #8b8d97;color:#F3F0E8;background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:21px;cursor:pointer}
.ask{display:flex;gap:10px}
.ask input{background:#33353c;color:#F3F0E8;border-color:#8b8d97}
.send{flex:none;width:52px;height:52px;border-radius:50%;background:var(--yellow);border:none;display:grid;place-items:center;cursor:pointer;color:var(--stone)}
.mic{align-self:center;width:84px;height:84px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;color:var(--stone);box-shadow:0 0 0 10px rgba(242,183,5,.25);border:none;opacity:.8}
.note{font-size:17px;color:var(--mute)}
.dark .note{color:#b6b9c7}
.ok{color:#14764a;font-weight:700}.warn{color:#a35200;font-weight:700}
a{color:var(--cobalt);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
nav .bar2{pointer-events:auto;width:100%;max-width:520px;background:var(--stone);border-radius:34px;display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;align-items:end;padding:10px 6px 8px;position:relative;border:2px solid #000}
nav button{background:none;border:none;color:#F3F0E8;font-weight:700;font-size:14px;letter-spacing:0;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0}
nav button[aria-current="true"]{color:var(--yellow)}
nav .fab{width:76px;height:76px;border-radius:50%;background:var(--yellow);color:var(--stone);margin:-38px auto 0;border:6px solid var(--paper);box-shadow:3px 3px 0 var(--indigo);justify-content:center}
nav button.fab,nav button.fab[aria-current="true"]{color:var(--stone)}
body.dark nav .fab{border-color:var(--stone)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
svg{flex:none}
.chk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:3px solid var(--indigo);border-radius:18px;padding:10px 12px;font-weight:700;font-size:21px;cursor:pointer}
.chk i{width:26px;height:26px;border-radius:8px;border:3px solid var(--indigo);flex:none;display:grid;place-items:center;background:var(--paper);color:var(--indigo)}
.chk[aria-checked="true"] i{background:var(--yellow)}
.chk[aria-checked="true"] span{text-decoration:line-through;opacity:.65}
.addr{background:var(--paper);border:3px dashed var(--indigo);border-radius:18px;padding:10px 12px;font-weight:700;font-size:21px;overflow-wrap:anywhere}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<nav aria-label="Navegação"><div class="bar2" id="nav"></div></nav>

<script>
(function(){
var LOGO="logo.png", PHOTO='';
var FORM_URL='', GC_CODE='';
function track(n){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:n,title:n,event:true})}catch(e){}}
function initGC(){if(!GC_CODE)return;var sc=document.createElement('script');sc.async=true;sc.setAttribute('data-goatcounter','https://'+GC_CODE+'.goatcounter.com/count');sc.src='https://gc.zgo.at/count.js';document.head.appendChild(sc)}
var $=function(s,r){return (r||document).querySelector(s)};
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var ICON={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
 pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/>',
 flag:'<path d="M6 21V4"/><path d="M6 4h12l-3 4 3 4H6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 ticket:'<path d="M3 8a2 2 0 002-2h14a2 2 0 002 2v2a2 2 0 000 4v2a2 2 0 00-2 2H5a2 2 0 00-2-2v-2a2 2 0 000-4z"/><path d="M14 6v12" stroke-dasharray="2 3"/>',
 send:'<path d="M4 12l16-8-6 17-3-7z"/>'
};
function ic(n,s,w){return '<svg width="'+(s||26)+'" height="'+(s||26)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||2.2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>'}

var CODIGO='CHAMEGO07';
var ADDR='R. do Passo, 26 - Santo Antônio Além do Carmo, Salvador - BA, 40301-408';
var SHARE='Bora pro Baile do Chamego? Sábado, 07/11, às 19h, no Korin Efan, em Santo Antônio Além do Carmo. Com Forró da Gota e DJ Preta. Ingresso no link da bio do @chamegobaile. Achei no desvio.ssa, Salvador sem cartão-postal.';
var PREP=[['ing','Ingresso comprado'],['volta','Volta combinada (com quem e como)'],['cel','Celular carregado'],['doc','Documento e um dinheiro à mão']];
var S=ls('state')||{};
S.lambes=S.lambes||[]; S.m2=!!S.m2; S.m3=!!S.m3; S.stamps=S.stamps||{}; S.fb=S.fb||null; S.trat=S.trat||''; S.nome=S.nome||''; S.prep=S.prep||{};
var tab=ls('tab')||'home'; if(['home','role','missoes','guia','perfil'].indexOf(tab)<0)tab='home';
var chat=[{c:'g',t:'E aí, tudo bem? Eu sou o Guia do desvio.ssa. Bora fugir do cartão-postal? Pergunta do show de sábado, de como chegar ou como voltar.'}];

function save(){ls('state',S)}
function days(){var d=Date.UTC(2026,10,7,22,0,0)-Date.now(); if(d<=0)return 0; return Math.ceil(d/864e5)}
function when(){var d=days(); return d===0?'hoje':d===1?'amanhã':'em '+d+' dias'}
function selos(){var n=0;['sa'].forEach(function(k){if(S.stamps[k])n++});if(S.lambes.length>=3&&S.stamps.m1==null){} return n}
function missionsDone(){return (S.lambes.length>=3?1:0)+(S.m2?1:0)+(S.m3?1:0)}
function greet(){var n=S.nome?esc(S.nome):'';var t=S.trat==='pivete'?'meu pivete':S.trat==='piveta'?'minha piveta':n;return t?'Qual a boa de hoje, '+t+'?':'Qual a boa de hoje?'}

function mapSvg(){return '<svg viewBox="0 0 360 150" role="img" aria-label="Esquema do desvio de hoje, uma parada marcada"><rect width="360" height="150" fill="#DCE4FB"/>'+
 '<rect x="14" y="8" width="70" height="44" fill="#C3D0F6"/><rect x="250" y="8" width="90" height="48" fill="#C3D0F6"/><rect x="120" y="92" width="60" height="40" fill="#C3D0F6"/><rect x="232" y="88" width="80" height="48" fill="#C3D0F6"/>'+
 '<path d="M0 62h360M0 118h360M62 0l36 150M200 0l30 150" stroke="#F3F0E8" stroke-width="9" fill="none"/>'+
 '<path d="M80 100 C120 50 160 58 190 52 S250 100 290 92" stroke="#1C2A72" stroke-width="3.5" fill="none" stroke-dasharray="9 8" stroke-linecap="round"/>'+
 '<circle cx="80" cy="100" r="19" fill="#F2B705" stroke="#1C2A72" stroke-width="4"/><text x="80" y="108" text-anchor="middle" font-family="Alfa Slab One,serif" font-size="22" fill="#1C2A72">1</text>'+
 '<circle cx="190" cy="52" r="17" fill="#DCE4FB" stroke="#1C2A72" stroke-width="3.5" stroke-dasharray="5 5"/><text x="190" y="59" text-anchor="middle" font-family="Alfa Slab One,serif" font-size="20" fill="#1C2A72">2</text>'+
 '<circle cx="290" cy="92" r="17" fill="#DCE4FB" stroke="#1C2A72" stroke-width="3.5" stroke-dasharray="5 5"/><text x="290" y="99" text-anchor="middle" font-family="Alfa Slab One,serif" font-size="20" fill="#1C2A72">3</text></svg>'}

function vHome(){
 var m=missionsDone(), l=S.lambes.length;
 return '<div class="top"><img src="'+LOGO+'" alt="desvio.ssa"><div class="t"><div class="eyebrow">Salvador</div><h1>Bora desviar?</h1></div></div>'+
 '<p class="note" style="margin-top:-6px;font-size:20px">'+greet()+'</p>'+
 '<div class="card map">'+mapSvg()+'<div class="foot"><span>Seu desvio de hoje</span><b>1 parada · 2 em breve</b></div></div>'+
 '<button class="card stop" data-go="role"><div class="tile"></div><div class="tx"><div class="eyebrow">Próxima parada</div><h3>Baile do Chamego · forró ao vivo</h3><div class="m">Santo Antônio Além do Carmo · sáb, 07/11, 19h</div></div><div class="badge">'+when()+'</div></button>'+
 '<button class="card mission" data-go="missoes"><div class="ic">'+ic('flag',26)+'</div><div style="flex:1;min-width:0"><b>Missão do dia: ache 3 lambes</b><div class="bar"><i style="width:'+Math.round(l/3*100)+'%"></i></div></div><span class="num">'+l+'/3</span></button>'
}

function prepCard(){
 var items=PREP.map(function(p){var on=!!S.prep[p[0]];return '<button class="chk" role="checkbox" aria-checked="'+on+'" data-prep="'+p[0]+'"><i>'+(on?ic('flag',14,3):'')+'</i><span>'+p[1]+'</span></button>'}).join('');
 return '<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">Prepare o rolê</div><div class="addr">'+esc(ADDR)+'</div>'+
 '<div class="btns"><button class="cta s" data-copy="addr">Copiar endereço</button><a class="cta s" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ADDR)+'" target="_blank" rel="noopener">Abrir no mapa</a></div>'+
 '<p id="cp-msg2" class="note" role="status"></p>'+items+'</div>'}
function stampBlock(){
 if(S.stamps.sa)return '<div class="card mission"><div class="ic">'+ic('flag',26)+'</div><b>Tá ligado, selo de Santo Antônio garantido!</b></div>';
 return '<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">Selo do bairro</div><p>Já está no show? Pergunte à banda ou ao pessoal da casa o código do dia e digite aqui.</p><label for="code" class="note">Código do dia</label><input id="code" type="text" maxlength="20" autocomplete="off" autocapitalize="characters"><button class="cta p" id="code-ok">Validar código</button><p id="code-msg" class="note" role="status"></p></div>'}
function copyText(t,msgId){
 var m=$('#'+msgId);
 function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);if(m){m.textContent=ok?'Copiado!':'Não consegui copiar. Segure o texto e copie na mão.';m.className=ok?'ok':'warn'}}
 try{navigator.clipboard.writeText(t).then(function(){if(m){m.textContent='Copiado!';m.className='ok'}},fb)}catch(e){fb()}
}
function vRole(){
 var fb=S.fb;
 return '<div class="hero"'+(PHOTO?' style="background-image:url('+PHOTO+');background-size:cover;background-position:center"':'')+'><button class="roundbtn" data-go="home" aria-label="Voltar">'+ic('back',26)+'</button>'+(PHOTO?'<small>Foto: divulgação da banda</small>':'')+'</div>'+
 '<span class="tag">Show ao vivo</span>'+
 '<div><h2>Baile do Chamego</h2><p style="color:var(--cobalt);font-weight:700;font-size:23px;margin-top:6px">Forró · Santo Antônio Além do Carmo</p></div>'+
 '<p>Banda de 4 pessoas com repertório próprio e músicas de outros artistas. Forró gostoso de ouvir, sem medo de misturar outros ritmos. Na mesma noite: Forró da Gota e DJ Preta.</p>'+
 '<div class="tri">'+
 '<div class="card"><div class="ci">'+ic('clock',22)+'</div><small>QUANDO</small><b>Sáb, 07/11<br>19h</b></div>'+

 stampBlock()+
 '<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">Depois do rolê</div><h2 style="font-size:28px">Bateu certo?</h2><p>Foi massa, ficou quase ou não bateu?</p>'+
 '<div class="opts" role="group" aria-label="Bateu certo?"><button class="opt" data-v="bateu" aria-pressed="'+(fb==='bateu')+'">Bateu!</button><button class="opt" data-v="quase" aria-pressed="'+(fb==='quase')+'">Quase</button><button class="opt" data-v="nao" aria-pressed="'+(fb==='nao')+'">Não bateu</button></div>'+

 '<button class="cta p" id="fb-send">Enviar</button><p id="fb-msg" class="note" role="status"></p></div>'
}

function vMissoes(){
 var n=selos(), lam=S.lambes.length;

 '<div class="stamps"><div><div class="stamp'+(S.stamps.sa?' on':'')+'">'+(S.stamps.sa?'SA':'?')+'</div><div class="slbl">Santo Antônio</div></div>'+
 '<div><div class="stamp">?</div><div class="slbl">Em breve</div></div><div><div class="stamp">?</div><div class="slbl">Em breve</div></div>'+
 '<div><div class="stamp">?</div><div class="slbl">Em breve</div></div><div><div class="stamp">?</div><div class="slbl">Em breve</div></div><div><div class="stamp">?</div><div class="slbl">Em breve</div></div></div>'+

 '<div class="card ms'+(lam>=3?' done':'')+'" style="flex-wrap:wrap"><div class="no">1</div><div class="tx">Ache 3 lambes de um bairro<div class="bar"><i style="width:'+Math.round(lam/3*100)+'%"></i></div></div><div class="lam" style="width:100%">'+lamBtns+'</div></div>'+
 '<button class="card ms y'+(S.m2?' done':'')+'" data-m="m2"><div class="no">2</div><div class="tx">Coma onde o bairro come<div class="bar"><i style="width:'+(S.m2?100:0)+'%"></i></div></div></button>'+
 '<button class="card ms'+(S.m3?' done':'')+'" data-m="m3"><div class="no">3</div><div class="tx">Volte por outro caminho<div class="bar"><i style="width:'+(S.m3?100:0)+'%"></i></div></div></button>'+
 '<p class="note">Toque numa missão para marcar como feita. Lambe: marque um por vez.</p>'

function vGuia(){
 var h=chat.map(function(m){return '<div class="b '+m.c+'">'+esc(m.t)+'</div>'}).join('');
 return '<div class="top"><button class="roundbtn" data-go="home" aria-label="Voltar" style="background:transparent;border-color:#8b8d97;color:#F3F0E8">'+ic('back',26)+'</button><img src="'+LOGO+'" alt=""><div class="t"><h2 style="font-size:30px;color:#F3F0E8">Guia</h2><p class="sub" style="color:var(--sky)">Respostas verificadas</p></div></div><span class="live">VOZ EM BREVE</span>'+
 '<div class="chat" id="chat" aria-live="polite">'+h+'</div>'+
 '<div class="chips">'+FAQ.map(function(f,i){return '<button class="chip" data-q="'+i+'">'+f[0]+'</button>'}).join('')+'</div>'+
 '<button class="mic" aria-disabled="true" aria-label="Voz chega na próxima versão" tabindex="-1">'+ic('mic',34)+'</button><p class="note" style="text-align:center">A voz do Guia chega na próxima versão.</p>'
}

function vPerfil(){
 function o(v,l){return '<button class="opt" data-t="'+v+'" aria-pressed="'+(S.trat===v)+'">'+l+'</button>'}
 return '<div class="top"><div class="t"><div class="eyebrow">Você</div><h1>Perfil</h1></div><img src="'+LOGO+'" alt=""></div>'+
 '<div class="card" style="display:flex;flex-direction:column;gap:10px"><h2 style="font-size:26px">Como quer ser chamado?</h2>'+
 '<div class="opts" role="group" aria-label="Tratamento">'+o('pivete','Meu pivete')+o('piveta','Minha piveta')+o('nome','Só o nome')+'</div>'+
 '<label for="nome" class="note">Seu nome ou apelido</label><input id="nome" type="text" maxlength="30" value="'+esc(S.nome)+'" autocomplete="off"><button class="cta p" id="nome-ok">Salvar</button><p id="p-msg" class="note" role="status"></p></div>'+
 '<div class="card"><div class="eyebrow">Piloto</div><p>Este é o piloto do desvio.ssa, com um bairro e um rolê. Seu retorno em "Bateu certo?" ajuda a melhorar o app.</p></div>'
}

var VIEWS={home:vHome,role:vRole,missoes:vMissoes,guia:vGuia,perfil:vPerfil};
function nav(){
 function b(t,i,l,cls){return '<button data-go="'+t+'" '+(cls?'class="'+cls+'" ':'')+'aria-current="'+(tab===t)+'" aria-label="'+l+'">'+ic(i,i==='mic'?34:26)+(cls?'':'<span>'+l+'</span>')+'</button>'}
 $('#nav').innerHTML=b('home','home','Início')+b('role','pin','Rolê')+b('guia','mic','Guia','fab')+b('missoes','flag','Missões')+b('perfil','user','Perfil');
}
function render(keepScroll){
 var y=window.scrollY;
 document.body.classList.toggle('dark',tab==='guia');
 $('#app').innerHTML=VIEWS[tab](); nav();
 window.scrollTo(0,keepScroll?y:0);
}
function go(t){tab=t;ls('tab',t);render(false)}

document.addEventListener('click',function(e){
 var el=e.target.closest('button,a'); if(!el)return;
 if(el.tagName==='A'){var hf=el.getAttribute('href')||'';track(hf.indexOf('instagram')>-1?'clique-ingresso':'abrir-mapa')}
 if(el.dataset.go){go(el.dataset.go);return}
 if(el.dataset.l){var i=el.dataset.l,k=S.lambes.indexOf(i);if(k>-1)S.lambes.splice(k,1);else S.lambes.push(i);save();render(true);return}
 if(el.dataset.m){S[el.dataset.m]=!S[el.dataset.m];save();render(true);return}
 if(el.dataset.copy){if(el.dataset.copy==='share'){track('compartilhar');copyText(SHARE,'cp-msg')}else{track('copiar-endereco');copyText(ADDR,'cp-msg2')}return}
 if(el.dataset.prep){S.prep[el.dataset.prep]=!S.prep[el.dataset.prep];save();render(true);return}
 if(el.id==='code-ok'){var v=($('#code').value||'').trim().toUpperCase(),cm=$('#code-msg');
  if(v===CODIGO){S.stamps.sa=true;save();track('selo-sa');render(true)}
  else{cm.textContent='Esse código não bateu. Pergunta pra banda ou pro pessoal da casa.';cm.className='warn'}return}
 if(el.dataset.v&&el.classList.contains('opt')){S.fb=el.dataset.v;ls('state',S);var t=$('#fb-txt'),v=t?t.value:'';render(true);if($('#fb-txt'))$('#fb-txt').value=v;return}
 if(el.dataset.t){S.trat=el.dataset.t;var nm=$('#nome');if(nm)S.nome=nm.value;save();render(true);return}
 if(el.id==='nome-ok'){S.nome=$('#nome').value.slice(0,30);save();$('#p-msg').textContent='Salvo.';$('#p-msg').className='ok';return}
 if(el.id==='fb-send'){sendFb();return}
 if(el.dataset.q){ask(+el.dataset.q);return}
});

var FALLBACK='Essa eu não sei te dizer com certeza e prefiro não chutar. Vale perguntar lá no próprio lugar.';
var FAQ=[
 ['Que horas começa?','Sábado, 07/11, às 19h. Tocam o Baile do Chamego, o Forró da Gota e a DJ Preta. O horário de cada atração ainda não está confirmado, então chegue com folga.'],
 ['Onde é?','No Korin Efan, R. do Passo, 26, Santo Antônio Além do Carmo, Salvador. CEP 40301-408. Na aba Rolê tem o botão pra copiar o endereço e abrir no mapa.'],
 ['Como compro o ingresso?','O ingresso está à venda pelo link na bio do @chamegobaile, no Instagram.'],
 ['Como volto pra casa?','Se liga: combine a volta antes de sair, vá e volte em grupo e peça o carro de aplicativo ainda dentro do local. Guarde o celular enquanto anda na rua.'],
 ['Tem desconto pelo app?','Ainda não tem desconto confirmado. Quando tiver, aparece aqui.'],
 ['O que vestir?',FALLBACK],
 ['Quanto custa?',FALLBACK],
 ['Tem estacionamento?',FALLBACK]
];
function sendFb(){
 var m=$('#fb-msg');
 if(!S.fb){m.textContent='Escolha uma opção primeiro.';m.className='warn';return}
 track('bateu-certo-'+S.fb);
 ls('fb-pending',{voto:S.fb,texto:($('#fb-txt').value||'').slice(0,240),em:new Date().toISOString()});
 if(FORM_URL){m.innerHTML='Valeu! Pra o retorno chegar até nós, <a href="'+FORM_URL+'" target="_blank" rel="noopener">toque aqui e conte em uma linha</a>. Bora de novo?';m.className='ok'}
 else{m.textContent=GC_CODE?'Valeu! Seu voto foi contado. Bora de novo?':'Valeu! Bora de novo?';m.className='ok'}
}
function ask(i){
 var f=FAQ[i]; if(!f)return; track('guia-'+i);
 chat.push({c:'u',t:f[0]}); chat.push({c:'g',t:f[1]}); render(true);
 window.scrollTo(0,document.body.scrollHeight);
}

render(false);
initGC();
setInterval(function(){if(tab==='home')render(true)},60000);
})();
</script>
