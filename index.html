<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F0E8">
<meta name="description" content="Salvador sem cartão-postal. O rolê que o guia comum não conta.">
<meta property="og:title" content="desvio.ssa">
<meta property="og:description" content="Salvador sem cartão-postal. Baile do Chamego, sábado 07/11, 19h.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://desvio-ssa.github.io/icone.png">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="desvio.ssa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>desvio.ssa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* v2: mesma identidade (paleta, Alfa Slab + Barlow, azulejo, borda índigo com sombra dura, barra escura com microfone amarelo).
   Mais cara de app: barra superior fixa, telas que entram com animação, cartões e botões com relevo, toques 3D em CSS. */
:root{
  --paper:#F3F0E8; --card:#FBF9F3; --indigo:#1C2A72; --cobalt:#2F52D9; --sky:#9DB2F2; --yellow:#F2B705; --yellow-d:#B98A00; --stone:#25262B; --mute:#5a6190;
  --display:'Alfa Slab One','Rockwell','Georgia',serif;
  --body:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --az:linear-gradient(45deg,transparent 46%,rgba(47,82,217,.07) 46%,rgba(47,82,217,.07) 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,rgba(47,82,217,.07) 46%,rgba(47,82,217,.07) 54%,transparent 54%),linear-gradient(rgba(47,82,217,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(47,82,217,.13) 2px,transparent 2px);
  --az-l:linear-gradient(45deg,transparent 46%,rgba(243,240,232,.07) 46%,rgba(243,240,232,.07) 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,rgba(243,240,232,.07) 46%,rgba(243,240,232,.07) 54%,transparent 54%),linear-gradient(rgba(243,240,232,.12) 2px,transparent 2px),linear-gradient(90deg,rgba(243,240,232,.12) 2px,transparent 2px);
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--paper)}
body{margin:0;background-color:var(--paper);color:var(--indigo);font-family:var(--body);font-weight:500;font-size:20px;line-height:1.25;
  background-image:var(--az);background-size:64px 64px;background-attachment:fixed;
  padding-inline:var(--gut) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;min-height:100%;-webkit-tap-highlight-color:transparent}
body.dark{background-color:var(--stone);color:#F3F0E8;background-image:linear-gradient(45deg,transparent 46%,rgba(255,255,255,.035) 46%,rgba(255,255,255,.035) 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,rgba(255,255,255,.035) 46%,rgba(255,255,255,.035) 54%,transparent 54%),linear-gradient(rgba(255,255,255,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.06) 2px,transparent 2px)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:14px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;line-height:1.02}
h1{font-size:40px} h2{font-size:30px}
.eyebrow{font-weight:700;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--cobalt)}
.dark .eyebrow{color:var(--sky)}
button{font:inherit;color:inherit}

/* Barra superior fixa */
.appbar{position:sticky;top:0;z-index:6;margin-inline:calc(-1 * var(--gut)) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:calc(10px + env(safe-area-inset-top,0px)) var(--gut) 10px;
  background:rgba(243,240,232,.84);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);border-bottom:2px solid transparent;transition:border-color .2s,box-shadow .2s}
.appbar.sc{border-bottom-color:rgba(28,42,114,.14);box-shadow:0 6px 18px -12px rgba(28,42,114,.45)}
.appbar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.lg{width:40px;height:40px;flex:none;border-radius:9px;border:2.5px solid var(--indigo);background:url(az-d.webp) center/cover;box-shadow:3px 3px 0 var(--indigo);transform:rotate(-5deg)}
.wm{font-family:var(--display);font-size:25px;line-height:1;color:var(--indigo);display:flex;align-items:baseline;gap:5px;flex:1;min-width:0}
.wm i{width:9px;height:9px;background:var(--yellow);transform:rotate(45deg);display:inline-block}
.wm span{color:var(--cobalt)}
.pill{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border:2px solid var(--indigo);background:var(--card);border-radius:999px;padding:5px 11px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pill b{width:8px;height:8px;border-radius:50%;background:#1f9d5b;box-shadow:0 0 0 3px rgba(31,157,91,.2)}
body.dark .appbar{background:rgba(37,38,43,.86)}
body.dark .appbar.sc{border-bottom-color:rgba(255,255,255,.1)}
body.dark .wm{color:#F3F0E8} body.dark .wm span{color:var(--sky)}
body.dark .pill{background:#33353c;border-color:#8b8d97;color:#F3F0E8}
body.dark .lg{border-color:#8b8d97;box-shadow:3px 3px 0 #000}

/* Título de tela */
.ttl{display:flex;flex-direction:column;gap:2px}
.ttl .note{font-size:20px;margin-top:4px}

/* Entrada das telas */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.wrap.anim>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
.wrap.anim>*:nth-child(2){animation-delay:.05s}.wrap.anim>*:nth-child(3){animation-delay:.1s}.wrap.anim>*:nth-child(4){animation-delay:.15s}
.wrap.anim>*:nth-child(5){animation-delay:.2s}.wrap.anim>*:nth-child(6){animation-delay:.25s}.wrap.anim>*:nth-child(n+7){animation-delay:.3s}

/* Cartões com relevo */
.card{background:var(--card);border:3px solid var(--indigo);border-radius:26px;box-shadow:6px 6px 0 var(--indigo);padding:16px;min-width:0;position:relative;
  background-image:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 38%)}
button.card{width:100%;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s}
button.card:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--indigo)}

/* Início: azulejo 3D */
.h3d{position:relative;min-height:214px;border-radius:28px;border:3px solid var(--indigo);box-shadow:6px 6px 0 var(--indigo);overflow:hidden;
  background-color:var(--indigo);background-image:var(--az-l);background-size:44px 44px;color:var(--paper);touch-action:pan-y}
.h3d::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--indigo) 30%,rgba(28,42,114,.75) 52%,rgba(28,42,114,0) 78%);pointer-events:none}
.h3d-tx{position:relative;z-index:2;padding:22px 18px;max-width:62%;display:flex;flex-direction:column;gap:6px}
.h3d .eyebrow{color:var(--yellow)}
.h3d h1{color:var(--paper);font-size:38px}
.h3d p{color:var(--sky);font-size:20px;font-weight:600}
.h3d-sc{position:absolute;z-index:0;right:-46px;top:50%;width:250px;height:250px;margin-top:-125px;perspective:760px}
.wall{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5px;transform-style:preserve-3d;
  transform:rotateX(calc(16deg + var(--ty,0deg))) rotateY(calc(-30deg + var(--tx,0deg))) rotateZ(3deg);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.wall .t{border-radius:5px;background:center/cover;box-shadow:0 0 0 1.5px rgba(10,16,50,.6)}
.wall .sh{position:absolute;left:33.4%;top:33.4%;width:32%;height:32%;border-radius:6px;background:rgba(5,10,40,.55);filter:blur(7px);transform:translateZ(1px)}
.wall .t.d{position:relative;transform:translateZ(40px);box-shadow:0 0 0 2.5px var(--paper),0 0 0 5px var(--indigo);animation:flt 3.8s ease-in-out infinite}
@keyframes flt{50%{transform:translateZ(58px) rotateZ(-2deg)}}

/* Mapa 3D */
.map{padding:0;overflow:hidden}
.map3d{position:relative;height:158px;overflow:hidden;background:#DCE4FB;perspective:520px;border-bottom:3px solid var(--indigo)}
.mapin{position:absolute;left:-10%;right:-10%;top:-8px;transform:rotateX(42deg);transform-origin:50% 70%}
.mapin svg{display:block;width:100%;height:auto}
.pin{position:absolute;left:0;top:0;width:40px;height:40px;margin:-52px 0 0 -20px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--yellow);border:3px solid var(--indigo);box-shadow:3px 3px 0 var(--indigo);display:grid;place-items:center;animation:bob 2.4s ease-in-out infinite;visibility:hidden}
.pin span{transform:rotate(45deg);font-family:var(--display);font-size:19px;color:var(--indigo)}
.pin::after{content:"";position:absolute;left:-6px;bottom:-6px;width:10px;height:10px;border-radius:50%;background:rgba(28,42,114,.35);filter:blur(2px)}
@keyframes bob{50%{margin-top:-58px}}
.map .foot{display:flex;flex-direction:column;gap:2px;padding:12px 18px 14px}
.map .foot span{font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--cobalt)}
.map .foot b{font-size:23px;line-height:1.1}

/* Próxima parada */
.stop{display:flex;gap:14px;align-items:center}
.ph{width:66px;height:66px;flex:none;border-radius:16px;border:3px solid var(--indigo);background:center 30%/cover;box-shadow:3px 3px 0 var(--indigo);transform:rotate(-3deg)}
.stop .tx{flex:1 1 auto;min-width:0}
.stop h3{font-size:23px;font-weight:700;line-height:1.05}
.stop .m{color:var(--mute);font-size:18px;margin-top:2px}
.cd{flex:none;min-width:58px;background:var(--yellow);color:var(--stone);border:3px solid var(--indigo);border-radius:16px;box-shadow:3px 3px 0 var(--indigo);text-align:center;padding:6px 6px 4px;line-height:1}
.cd b{display:block;font-family:var(--display);font-size:30px}
.cd small{font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.cd.w{font-weight:700;font-size:20px;padding:12px 8px}

/* Missão */
.mission{background:var(--yellow);color:var(--stone);display:flex;align-items:center;gap:14px;background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%)}
.mission .ic{width:52px;height:52px;border-radius:50%;background:var(--stone);display:grid;place-items:center;flex:none;color:var(--yellow);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.bar{height:12px;border-radius:9px;background:rgba(37,38,43,.2);overflow:hidden;margin-top:7px;box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
.bar i{display:block;height:100%;background:var(--stone);border-radius:9px;transition:width .4s}
.mission b{font-size:23px;line-height:1.1;display:block}
.mission .num{font-family:var(--display);font-size:24px}

.roundbtn{width:50px;height:50px;border-radius:50%;border:3px solid var(--indigo);background:rgba(243,240,232,.92);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--indigo);padding:0;box-shadow:3px 3px 0 var(--indigo)}
.roundbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--indigo)}

/* Rolê */
.hero{position:relative;height:330px;border-radius:28px;border:3px solid var(--indigo);box-shadow:6px 6px 0 var(--indigo);overflow:hidden;background:var(--cobalt) center 28%/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,42,114,0) 38%,rgba(28,42,114,.94) 86%)}
.hero .roundbtn{position:absolute;left:12px;top:12px;z-index:2}
.hero small{position:absolute;right:12px;top:14px;z-index:2;color:#F3F0E8;background:rgba(28,42,114,.7);border-radius:999px;padding:4px 10px;font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
.hcap{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;color:#F3F0E8;display:flex;flex-direction:column;gap:8px}
.hcap h2{font-size:36px;color:#F3F0E8}
.hcap p{color:var(--sky);font-weight:700;font-size:22px}
.tag{display:inline-block;align-self:flex-start;background:var(--yellow);color:var(--stone);border:2.5px solid var(--indigo);border-radius:12px;padding:3px 12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:16px;transform:rotate(-2deg)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tri .card{padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:22px;box-shadow:4px 4px 0 var(--indigo)}
.tri .ci{width:44px;height:44px;border-radius:50%;background:var(--cobalt);color:#F3F0E8;display:grid;place-items:center;border:2.5px solid var(--indigo);box-shadow:0 3px 0 var(--indigo);margin-bottom:2px}
.tri small{font-weight:700;letter-spacing:.14em;color:var(--cobalt);font-size:14px}
.tri b{font-size:20px;line-height:1.05}

/* Ingresso de desconto (recorte de ticket) */
.tk{filter:drop-shadow(6px 6px 0 var(--indigo))}
.tkin{--c:118px;background-color:var(--cobalt);background-image:var(--az-l);background-size:40px 40px;color:#F3F0E8;border-radius:24px;transform:rotate(-1.2deg);
  -webkit-mask:radial-gradient(circle 15px at left 0 top var(--c),#0000 96%,#000 100%) left/51% 100% no-repeat,radial-gradient(circle 15px at right 0 top var(--c),#0000 96%,#000 100%) right/51% 100% no-repeat;
  mask:radial-gradient(circle 15px at left 0 top var(--c),#0000 96%,#000 100%) left/51% 100% no-repeat,radial-gradient(circle 15px at right 0 top var(--c),#0000 96%,#000 100%) right/51% 100% no-repeat}
.tk-top{height:var(--c);padding:18px 22px 0;display:flex;flex-direction:column;gap:6px;border-bottom:3px dashed rgba(243,240,232,.55);margin:0 18px;padding-inline:4px}
.tk-top .eyebrow{color:var(--yellow)}
.tk-top b{font-size:26px;line-height:1.08}
.tk-bot{padding:16px 22px 20px;display:flex;flex-direction:column;gap:12px}
.tk-bot p{color:#E9EEFC}

.dica{background:var(--indigo);color:#F3F0E8;border-radius:22px;padding:16px;border:3px solid var(--indigo);box-shadow:6px 6px 0 rgba(28,42,114,.35);background-image:var(--az-l);background-size:44px 44px}
.dica .eyebrow{color:var(--yellow);display:block;margin-bottom:4px}
.dica small{display:block;margin-top:6px;color:var(--sky);font-size:16px}

/* Botões com relevo */
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btns .cta{flex:1 1 150px}
.cta{flex:0 0 auto;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:20px;text-align:center;text-decoration:none;border:3px solid var(--indigo);border-radius:999px;padding:13px 12px;cursor:pointer;display:block;box-shadow:4px 4px 0 var(--indigo);transition:transform .1s,box-shadow .1s}
.cta.p{background:var(--cobalt);color:#F3F0E8;background-image:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 50%)}
.cta.s{background:var(--card);color:var(--indigo)}
.cta.y{background:var(--yellow);color:var(--stone);background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 50%)}
.cta:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--indigo)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:3px solid var(--indigo);background:var(--card);border-radius:999px;padding:10px 4px;font-weight:700;font-size:20px;cursor:pointer;text-align:center;box-shadow:3px 3px 0 var(--indigo);transition:transform .1s,box-shadow .1s}
.opt[aria-pressed="true"]{background:var(--cobalt);color:#F3F0E8;transform:translate(3px,3px);box-shadow:0 0 0 var(--indigo)}
input[type=text],textarea{font:inherit;width:100%;border:3px solid var(--indigo);border-radius:18px;background:var(--card);color:var(--indigo);padding:10px 14px;box-shadow:inset 3px 3px 0 rgba(28,42,114,.1)}
textarea{resize:vertical;min-height:64px}

/* Missões: passaporte e selos */
.pass{background-color:var(--indigo);background-image:var(--az-l);background-size:44px 44px;color:#F3F0E8;border-radius:26px;display:flex;flex-direction:column;gap:6px}
.pass .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pass .eyebrow{color:var(--yellow)}
.pass .n{font-family:var(--display);font-size:36px;line-height:1}
.pass .lvl{background:var(--yellow);color:var(--stone);border:2.5px solid #0d1440;border-radius:10px;font-weight:700;letter-spacing:.16em;font-size:15px;padding:3px 10px;transform:rotate(3deg)}
.pass .bar{background:rgba(255,255,255,.18);height:14px;margin-top:8px}.pass .bar i{background:var(--yellow);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;text-align:center;perspective:600px}
.stamp{aspect-ratio:1;display:grid;place-items:center;border-radius:20px;font-family:var(--display);font-size:36px;border:3px dashed #8b94c4;color:#8b94c4;background:rgba(28,42,114,.04);box-shadow:inset 4px 4px 0 rgba(28,42,114,.08)}
.stamp.on{border:3px solid var(--indigo);background:url(az-cobalto.webp) center/cover;color:#F3F0E8;box-shadow:5px 5px 0 var(--indigo);transform:rotate(-4deg);text-shadow:0 0 0 #000,2px 2px 0 var(--indigo),-1px -1px 0 var(--indigo),1px -1px 0 var(--indigo),-1px 1px 0 var(--indigo)}
.stamp.flip{animation:flip .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{from{transform:rotateY(180deg) scale(.6)}to{transform:rotate(-4deg)}}
.slbl{font-weight:700;font-size:19px;margin-top:6px}
.ms{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;width:100%}
.ms .no{width:42px;height:42px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-family:var(--display);flex:none;border:2.5px solid var(--indigo);box-shadow:0 3px 0 var(--indigo)}
.ms.y .no{background:var(--yellow)}
.ms .tx{flex:1;min-width:0;font-weight:700;font-size:23px;line-height:1.05}
.ms .bar{background:#d3d5e0;margin-top:8px}.ms .bar i{background:var(--cobalt)}
.ms.done{background-color:#E9EEFC}
.lam{display:flex;gap:8px;margin-top:10px}
.lam button{flex:1;border:3px solid var(--indigo);background:var(--card);border-radius:14px;padding:8px 0;font-weight:700;font-size:19px;cursor:pointer;box-shadow:3px 3px 0 var(--indigo);transition:transform .1s,box-shadow .1s}
.lam button[aria-pressed="true"]{background:var(--yellow);transform:translate(3px,3px);box-shadow:0 0 0 var(--indigo)}

/* Guia */
.gtop{display:flex;align-items:center;gap:12px}
.gtop .lg{width:52px;height:52px;border-radius:12px}
.gtop .t{flex:1;min-width:0}
.gtop p{color:var(--sky);font-size:19px}
.chat{display:flex;flex-direction:column;gap:12px}
.b{max-width:88%;padding:12px 16px;border-radius:22px;font-size:22px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:4px 4px 0 #000}
.b.u{align-self:flex-end;background:var(--cobalt);color:#F3F0E8;border-bottom-right-radius:6px}
.b.g{align-self:flex-start;background:var(--paper);color:var(--indigo);border-bottom-left-radius:6px}
.live{align-self:flex-start;background:rgba(242,183,5,.16);color:var(--yellow);font-weight:700;letter-spacing:.16em;border-radius:12px;padding:6px 12px;font-size:15px;border:2px solid rgba(242,183,5,.45)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:2.5px solid #8b8d97;color:#F3F0E8;background:#2e3036;border-radius:999px;padding:8px 16px;font-weight:600;font-size:21px;cursor:pointer;box-shadow:3px 3px 0 #000;transition:transform .1s,box-shadow .1s}
.chip:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.mic{align-self:center;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE07A,var(--yellow) 55%,#d9a200);display:grid;place-items:center;color:var(--stone);box-shadow:0 7px 0 var(--yellow-d),0 0 0 12px rgba(242,183,5,.16),0 16px 30px rgba(0,0,0,.4);border:none;opacity:.85}
.note{font-size:17px;color:var(--mute)}
.dark .note{color:#b6b9c7}
.ok{color:#14764a;font-weight:700}.warn{color:#a35200;font-weight:700}
a{color:var(--cobalt);font-weight:700}

/* Perfil */
.me{display:flex;gap:16px;align-items:center}
.me .av{width:84px;height:84px;flex:none;border-radius:18px;border:3px solid var(--indigo);background:url(az-d.webp) center/cover;box-shadow:5px 5px 0 var(--indigo);transform:rotate(-4deg)}

function doInstall(){
 track('instalar-clique');

function copyText(t,msgId){
 var m=$('#'+msgId);
 function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);if(m){m.textContent=ok?'Copiado!':'Não consegui copiar. Segure o texto e copie na mão.';m.className=ok?'ok':'warn'}}
 try{navigator.clipboard.writeText(t).then(function(){if(m){m.textContent='Copiado!';m.className='ok'}},fb)}catch(e){fb()}
}

function nav(){
 var n=selos();
 function b(t,i,l,d){return '<button data-go="'+t+'" aria-current="'+(tab===t)+'"><span class="di">'+ic(i,24)+'</span><span class="dt"><b>'+l+'</b><small>'+d+'</small></span></button>'}
 var di=$('#dinst'); if(di)di.hidden=standalone;
 $('#nav').innerHTML=b('home','home','Início','Seu desvio de hoje')+b('role','pin','Rolê',dayDiff()===0?'É hoje · 19h no Korin Efan':'Baile do Chamego · sáb, 07/11')+b('guia','mic','Guia','Respostas verificadas')+b('missoes','flag','Missões',n+' de 6 selos')+b('perfil','user','Perfil','Como quer ser chamado');

function menu(open){document.body.classList.toggle('menu',open);$('#mbtn').setAttribute('aria-expanded',String(open));$('#drawer').setAttribute('aria-hidden',String(!open));
 try{if(open){var a=$('#nav [aria-current="true"]');if(a)a.focus({preventScroll:true})}else $('#mbtn').focus({preventScroll:true})}catch(e){}}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('menu'))menu(false)});
/* Pino em pé sobre o mapa inclinado */
function placePin(){var p=$('#pin1'),c=$('#p1'),box=$('.map3d');if(!p||!c||!box)return;
 var r=c.getBoundingClientRect(),b=box.getBoundingClientRect();
 p.style.left=(r.left+r.width/2-b.left)+'px';p.style.top=(r.top+r.height/2-b.top)+'px';p.style.visibility='visible'}
/* Azulejo 3D que acompanha o dedo ou a inclinação do celular */
function tilt(x,y){var w=$('#wall');if(!w)return;w.style.setProperty('--tx',(x*26).toFixed(1)+'deg');w.style.setProperty('--ty',(-y*20).toFixed(1)+'deg')}
function bindTilt(){var h=$('#h3d');if(!h)return;
 h.addEventListener('pointermove',function(e){var r=h.getBoundingClientRect();tilt((e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5)});
 h.addEventListener('pointerleave',function(){tilt(0,0)})}
window.addEventListener('deviceorientation',function(e){if(tab!=='home'||e.gamma==null)return;tilt(Math.max(-1,Math.min(1,e.gamma/30))*.5,Math.max(-1,Math.min(1,(e.beta-45)/30))*.5)});
function render(keepScroll){
 var y=window.scrollY;
 document.body.classList.toggle('dark',tab==='guia');
 var w=$('#app'); w.classList.toggle('anim',!keepScroll);
 w.innerHTML=VIEWS[tab](); nav();
 window.scrollTo(0,keepScroll?y:0);
 if(tab==='home'){placePin();requestAnimationFrame(placePin);setTimeout(placePin,500);bindTilt()}
}
function go(t){var was=document.body.classList.contains('menu');tab=t;ls('tab',t);if(was){document.body.classList.remove('menu');$('#mbtn').setAttribute('aria-expanded','false');$('#drawer').setAttribute('aria-hidden','true')}render(false)}
window.addEventListener('scroll',function(){var a=$('#appbar');if(a)a.classList.toggle('sc',window.scrollY>4)},{passive:true});
window.addEventListener('resize',function(){if(tab==='home')placePin()});

document.addEventListener('click',function(e){
 if(e.target.id==='scrim'){menu(false);return}
 if(e.target.classList&&e.target.classList.contains('sheet-wrap')){e.target.remove();return}
 var el=e.target.closest('button,a'); if(!el)return;
 if(el.id==='mbtn'){menu(true);return}
 if(el.dataset.sheetClose){var sw=el.closest('.sheet-wrap');if(sw)sw.remove();return}
 if(el.dataset.inst){if(document.body.classList.contains('menu'))menu(false);doInstall();return}
 if(el.dataset.instOff){ls('inst-off',1);render(true);return}
 if(el.id==='dclose'){menu(false);return}
 if(el.tagName==='A'){var hf=el.getAttribute('href')||'';track(hf.indexOf('instagram')>-1?'clique-ingresso':hf.indexOf('spotify')>-1?'ouvir-spotify':hf.indexOf('google.com/maps')>-1?'abrir-mapa':hf.indexOf('docs.google')>-1?'bateu-certo-form':'link')}
 if(el.dataset.go){go(el.dataset.go);return}
 if(el.dataset.l){var i=el.dataset.l,k=S.lambes.indexOf(i);if(k>-1)S.lambes.splice(k,1);else S.lambes.push(i);save();render(true);return}
 if(el.dataset.m){S[el.dataset.m]=!S[el.dataset.m];save();render(true);return}
 if(el.dataset.copy){if(el.dataset.copy==='share'){track('compartilhar');copyText(SHARE,'cp-msg')}else{track('copiar-endereco');copyText(ADDR,'cp-msg2')}return}
 if(el.dataset.prep){S.prep[el.dataset.prep]=!S.prep[el.dataset.prep];save();render(true);return}
 if(el.id==='code-ok'){var v=($('#code').value||'').trim().toUpperCase(),cm=$('#code-msg');
  if(v===CODIGO){S.stamps.sa=true;justStamped=true;save();track('selo-sa');render(true)}
  else{cm.textContent='Esse código não bateu. Pergunta pra banda ou pro pessoal da casa.';cm.className='warn'}return}
 if(el.dataset.v&&el.classList.contains('opt')){S.fb=el.dataset.v;ls('state',S);var t=$('#fb-txt'),v=t?t.value:'';render(true);if($('#fb-txt'))$('#fb-txt').value=v;return}
 if(el.dataset.t){S.trat=el.dataset.t;var nm=$('#nome');if(nm)S.nome=nm.value;save();render(true);return}
 if(el.id==='nome-ok'){S.nome=$('#nome').value.slice(0,30);save();render(true);$('#p-msg').textContent='Salvo.';$('#p-msg').className='ok';return}
 if(el.id==='fb-send'){sendFb();return}
 if(el.dataset.q){ask(+el.dataset.q);return}
});

function sendFb(){
 var m=$('#fb-msg');
 if(!S.fb){m.textContent='Escolha uma opção primeiro.';m.className='warn';return}
 track('bateu-certo-'+S.fb);
 ls('fb-pending',{voto:S.fb,texto:($('#fb-txt').value||'').slice(0,240),em:new Date().toISOString()});
 if(FORM_URL){m.innerHTML='Valeu! Pra o retorno chegar até nós, <a href="'+FORM_URL+'" target="_blank" rel="noopener">toque aqui e responda em 2 minutinhos</a>. Bora de novo?';m.className='ok'}
 else{m.textContent=GC_CODE?'Valeu! Seu voto foi contado. Bora de novo?':'Valeu! Bora de novo?';m.className='ok'}
}

}

render(false);
(function(){var el=document.getElementById('intro');if(!el)return;var seen=false;try{seen=sessionStorage.getItem('intro')==='1'}catch(e){}

ld('three.min.js',function(){ld('abertura.js',function(){if(done)return;
 var ib=document.createElement('div');ib.className='ib';el.appendChild(ib);el.hidden=false;
 try{DesvioIntro(ib,fim).then(function(){clearTimeout(lt);shown=true}).catch(fail)}catch(e){fail()}})})})();
initGC();

setInterval(function(){if(tab==='home')render(true)},60000);
})();
